services:
  redis:
    container_name: lupus-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - lupus_redis_data:/data

  postgres:
    container_name: lupus-postgres
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lupus
    ports:
      - "5432:5432"
    volumes:
      - lupus_postgres_data:/var/lib/postgresql/data

volumes:
  lupus_postgres_data:
  lupus_redis_data: