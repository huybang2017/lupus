server {
  listen 80;
  root /usr/share/nginx/html;

  location ~ ^/(store|auth|admin|hooks|uploads|health) {
    proxy_pass http://api:9001;
    proxy_set_header Host $host;
    client_max_body_size 50m;
  }

  location = / {
    return 302 /app/;
  }

  location /app/ {
    try_files $uri /app/index.html;
  }
}
